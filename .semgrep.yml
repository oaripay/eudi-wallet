rules:
  - id: oari-no-console-output
    message: Wallet source must use a reviewed redacting logger, not console output.
    severity: ERROR
    languages: [swift]
    paths:
      include:
        - /App/**
        - /Packages/Sources/**
    patterns:
      - pattern-either:
          - pattern: print(...)
          - pattern: debugPrint(...)
          - pattern: NSLog(...)
  - id: oari-no-unprotected-sensitive-defaults
    message: Credentials, tokens and proofs must not be stored in UserDefaults.
    severity: ERROR
    languages: [swift]
    paths:
      include:
        - /App/**
        - /Packages/Sources/**
    pattern: 'UserDefaults.$X.set($VALUE, forKey: $KEY)'
