name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: [self-hosted, macOS, ARM64, oari-swift-6-3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          swift --version | grep -F "Apple Swift version 6.3.2"
          xcodegen --version
          test "$(gitleaks version)" = "8.30.1"
          test "$(semgrep --version)" = "1.172.0"
          syft version | grep -F "Version:       1.50.0"
      - name: Generate project
        run: xcodegen generate
      - name: Check generated project
        run: git diff --exit-code -- OARIWallet.xcodeproj
      - name: Verify locked package graph
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved
          python3 Scripts/verify_dependency_review.py
          python3 Scripts/verify_wallet_kit_boundaries.py
      - name: Test domain modules
        run: swift test
      - name: Test
        run: >-
          xcodebuild -skipMacroValidation
          -project OARIWallet.xcodeproj -scheme OARIWallet
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro' test
      - name: Verify Release build
        run: >-
          xcodebuild -skipMacroValidation
          -project OARIWallet.xcodeproj -scheme OARIWallet
          -configuration Release
          -destination 'generic/platform=iOS Simulator' build
      - name: Verify Release Wallet Kit operation
        run: >-
          xcodebuild -skipMacroValidation
          -project OARIWallet.xcodeproj -scheme OARIWallet
          -configuration ReleaseTesting
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -only-testing:OARIWalletTests/WalletKitIOSIntegrationTests
          -only-testing:OARIWalletTests/WalletAppModelTests test
      - name: Scan tracked files for private material
        run: python3 Scripts/check_tracked_secrets.py
      - name: Secret scan
        run: |
          gitleaks detect --config .gitleaks.toml --no-banner --redact --source .
          gitleaks dir --config .gitleaks.toml --no-banner --redact .
      - name: Static analysis
        run: semgrep scan --config .semgrep.yml --error --no-git-ignore
      - name: Generate SBOM
        run: |
          syft dir:. --exclude './.build/**' -o spdx-json=sbom.spdx.json
          python3 Scripts/enrich_sbom_licenses.py
