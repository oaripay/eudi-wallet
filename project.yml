name: OariWallet

options:
  bundleIdPrefix: io.oari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  ReleaseTesting: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES
    ReleaseTesting:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

packages:
  OARIWalletModules:
    path: .

targets:
  OARIWallet:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    dependencies:
      - package: OARIWalletModules
        product: WalletDomain
      - package: OARIWalletModules
        product: ProtocolEngine
      - package: OARIWalletModules
        product: OariDesignSystem
      - package: OARIWalletModules
        product: WalletVault
      - package: OARIWalletModules
        product: EudiWalletKitAdapter
      - package: OARIWalletModules
        product: EbsiW3CBackend
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Oari Wallet
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Authenticate before sharing credentials or approving sensitive wallet actions.
        NSCameraUsageDescription: Scan credential offers and presentation requests.
        CFBundleURLTypes:
          - CFBundleURLName: io.oari.wallet.openid4vp
            CFBundleURLSchemes:
              - openid4vp
          - CFBundleURLName: io.oari.wallet.openid4vci
            CFBundleURLSchemes:
              - openid-credential-offer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: OARIWallet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/OARIWallet.entitlements
        DEVELOPMENT_ASSET_PATHS: '"App/Preview Content"'
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
      configs:
        ReleaseTesting:
          ENABLE_TESTABILITY: YES

  WalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
       - path: Tests
    dependencies:
      - target: OARIWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OARIWallet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OARIWallet"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
       - path: UITests
    dependencies:
      - target: OARIWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OARIWallet

schemes:
  OARIWallet:
    build:
      targets:
        OARIWallet: all
        WalletTests: [test]
        WalletUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - OARIWallet
      targets:
        - name: WalletTests
          parallelizable: true
          randomExecutionOrder: true
        - name: WalletUITests
          parallelizable: false
          randomExecutionOrder: false
    run:
      config: Debug
    archive:
      config: Release
