name: OARIWallet

options:
  bundleIdPrefix: io.oari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

packages:
  OARIWalletModules:
    path: .

targets:
  OARIWallet:
    type: application
    platform: iOS
    sources:
      - path: OARIWallet
    dependencies:
      - package: OARIWalletModules
        product: WalletDomain
      - package: OARIWalletModules
        product: ProtocolEngine
      - package: OARIWalletModules
        product: OariDesignSystem
      - package: OARIWalletModules
        product: WalletVault
    info:
      path: OARIWallet/Info.plist
      properties:
        CFBundleDisplayName: OARI Wallet
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Authenticate before sharing credentials or approving sensitive wallet actions.
        NSCameraUsageDescription: Scan credential offers and presentation requests.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet
        PRODUCT_NAME: OARIWallet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: '"OARIWallet/Preview Content"'
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  OARIWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OARIWalletTests
    dependencies:
      - target: OARIWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OARIWallet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OARIWallet"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  OARIWallet:
    build:
      targets:
        OARIWallet: all
        OARIWalletTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - OARIWallet
      targets:
        - name: OARIWalletTests
          parallelizable: true
          randomExecutionOrder: true
    run:
      config: Debug
    archive:
      config: Release
